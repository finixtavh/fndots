add_newline = false

format = """
$character\
$os$hostname\
$directory\
[](#33473D)$time[ ](#33473D)$cmd_duration\
$git_branch\
$git_status \
$python\
$aws\
$golang\
$java\
$rust\
$ruby\
$scala\
$dart\
$conda\
$pijul_channel\
$lua\
$rlang\
$package\
$buf\
$memory_usage\
$docker_context
[└─>](bold #89B19E)
"""

continuation_prompt = '▶▶ '

[character]
error_symbol = "X "

[time]
disabled = false
time_format = "%r"
style = "bg:#121212"
format = '[[ 󱑍 $time ](bg:#33473D fg:#89B19E)]($style)'

[cmd_duration]
format = 'last command: [$duration](bold #C8C8C8)'

[os]
format = '[ ](bold #89B19E) '
disabled = false

[os.symbols]
Linux = ''

[hostname]
ssh_only = false
format = 'on [$hostname](bold #89B19E) '
disabled = false

[directory]
truncation_length = 3
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only_style = '197'
read_only = '  '
format = 'at [$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = " "
format = '[$symbol$branch]($style)  '
truncation_symbol = '…/'
style = 'bold #89B19E'

[git_status]
format = '[$all_status$ahead_behind]($style)  '
style = 'bold #89B19E'
conflicted = '🏳  '
up_to_date = ''
untracked = ' $count  '
ahead = '⇡$count  '
diverged = '⇕⇡$ahead_count⇣$behind_count  '
behind = '⇣$count  '
stashed = '󰏗 $count  '
modified = ' $count  '
staged = '++$count  '
renamed = '襁 $count  '
deleted = ' $count  '

[aws]
symbol = " "

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[golang]
symbol = " "

[java]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "
disabled = true
style = 'bold dimmed white'
threshold = 1
format = "$symbol [${ram}(|${swap})]($style) "

[nodejs]
symbol = " "

[package]
symbol = "󰏗 "

[pijul_channel]
symbol = " "

[python]
symbol = " "
pyenv_version_name = true

[ruby]
symbol = " "

[rlang]
symbol = "󰟔 "

[rust]
symbol = " "

[scala]
symbol = " "
