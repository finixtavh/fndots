# hyprlock config
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(050505ff)
    zindex = -2
}

label {
    monitor =
    text = cmd[update:42] cat /tmp/hyprlock/chroma.pango
    color = rgba(89b19eff)
    font_size = 26
    font_family = JetBrainsMono Nerd Font Mono
    text_align = center
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(121212cc)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = /tmp/hyprlock/art-none.png
    reload_cmd = bash -lc '"${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/hyprlock/art.sh"'
    reload_time = 2
    size = 270
    rounding = 16
    border_size = 2
    border_color = rgba(2a2a2aff)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(050505ff)
    position = 0, -130
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] bash -lc '"${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/hyprlock/meta.sh" title'
    color = rgba(e8e8e8ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] bash -lc '"${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/hyprlock/meta.sh" artist'
    color = rgba(89b19ecc)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 145
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] bash -c 's=$(playerctl status 2>/dev/null); [ "$s" = "Playing" ] && echo "󰒮      󰏤      󰒭" || echo "󰒮      󰐊      󰒭"'
    color = rgba(c8c8c8ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 195
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 350, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.30
    dots_center = true
    rounding = 14
    outer_color = rgba(4d6b5cff)
    inner_color = rgba(121212cc)
    font_color = rgba(e8e8e8ff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <span foreground="##7a7a7a"><i>Password…</i></span>
    check_color = rgba(89b19eff)
    fail_color = rgba(cc5555ff)
    fail_text = <i>Wrong</i>
    capslock_color = rgba(89b19eff)
    position = 0, 230
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] hyprctl devices -j 2>/dev/null | grep -q '"capsLock": true' && echo "󰪛  Caps Lock"
    color = rgba(89b19eff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 316
    halign = center
    valign = bottom
    zindex = 3
}
